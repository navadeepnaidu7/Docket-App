# Cap Gradle JVM so OpenJDK does not grab multi-GB on every flutter run.
# Previous defaults (-Xmx8G / MaxMetaspaceSize=4G) allowed ~5GB+ per build.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
